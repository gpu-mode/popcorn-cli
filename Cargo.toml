[package]
name = "popcorn-cli"
version = "0.0.0-dev"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "multipart", "rustls", "rustls-native-certs"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ratatui = "0.30.2"
crossterm = "0.29.0"
anyhow = "1.0"
ctrlc = "3.5.2"
dirs = "6.0"
serde_yaml = "0.9"
webbrowser = "1.2"
base64-url = "3.0.4"
base64 = "0.23"
chrono = "0.4"
urlencoding = "2.1.3"
bytes = "1.12.1"
futures-util = "0.3.34"
zip = "8.6.0"

[dev-dependencies]
tempfile = "3.27"
